meta:
  engine: 4.1.0
  name: ansi60_split
  version: 0.18

# ANSI 80% (TKL) からナビゲーションブロックを除いた左右分割版 (80キー: スペースを 2.75u + 2.25u に分割)
# 最下段は 左: Ctrl/Super/Alt(1.5u) + Space(2.75u), 右: Space(2.25u) + Alt/Super(1.5u) + [0.75uギャップ] + ← ↓ →(1u)。
# 右手側は 65% 風に右端へ 1u 列 (Del/PgUp/PgDn と最下段の →) を持つ。シフト行の右端キーは無し。
# 最右列は → (最下段) を除いて 0.25u 右にオフセットし、本体との間に 0.25u の隙間を持つ。
# 全キーが osume marshmallow ベースキット (M2024V1) のサイズ構成で賄える。
# 分割点はタッチタイピングの運指に合わせて Esc+F1-F4|F5-F12, 5|6, T|Y, G|H, B|N。
# 1行 = 1ゾーンとして定義し、行ごとのスタッガーは anchor.shift で表現する。
# ゾーン名は l/r プレフィックスで左右を区別し、外形や PCB のフィルタ (/^l/, /^r/) に使う。
# U = 19.05mm (1u キーピッチ)。キー幅は width と、外形生成用の幅タグ (k100=1u, k125=1.25u, ...) で表現する。

units:
  # 左右の間隔 (左手ブロック右端から右手ブロック左端まで)
  splitgap: 30

points:
  key:
    spread: 1U
    padding: 1U
    width: 1U
    height: 1U
    tags: [k100]

  zones:
    # ================ 左手 ================
    # ---- F行: Esc [0.5uギャップ] F1 F2 F3 F4 (数字行との縦ピッチは 1.5U) ----
    lfn:
      anchor:
        shift: [0.5U, 1.5U]
      rows:
        r:
          row_net: R0
      columns:
        esc: { key.column_net: C0 }
        f1:
          key:
            spread: 1.5U
            column_net: C1
        f2: { key.column_net: C2 }
        f3: { key.column_net: C3 }
        f4: { key.column_net: C4 }

    # ---- 数字行: ` 1 2 3 4 5 ----
    lnum:
      anchor:
        shift: [0.5U, 0]
      rows:
        r:
          row_net: R1
      columns:
        grv: { key.column_net: C0 }
        n1: { key.column_net: C1 }
        n2: { key.column_net: C2 }
        n3: { key.column_net: C3 }
        n4: { key.column_net: C4 }
        n5: { key.column_net: C5 }

    # ---- Tab行: Tab(1.5u) Q W E R T ----
    ltab:
      anchor:
        shift: [0.75U, -1U]
      rows:
        r:
          row_net: R2
      columns:
        tab:
          key:
            width: 1.5U
            tags: [k150]
            column_net: C0
        q:
          key:
            spread: 1.25U
            column_net: C1
        w: { key.column_net: C2 }
        e: { key.column_net: C3 }
        r: { key.column_net: C4 }
        t: { key.column_net: C5 }

    # ---- ホーム行: Caps(1.75u) A S D F G ----
    lhome:
      anchor:
        shift: [0.875U, -2U]
      rows:
        r:
          row_net: R3
      columns:
        caps:
          key:
            width: 1.75U
            tags: [k175]
            column_net: C0
        a:
          key:
            spread: 1.375U
            column_net: C1
        s: { key.column_net: C2 }
        d: { key.column_net: C3 }
        f: { key.column_net: C4 }
        g: { key.column_net: C5 }

    # ---- シフト行: LShift(2.25u) Z X C V B ----
    lshift:
      anchor:
        shift: [1.125U, -3U]
      rows:
        r:
          row_net: R4
      columns:
        lsft:
          key:
            width: 2.25U
            tags: [k225]
            column_net: C0
        z:
          key:
            spread: 1.625U
            column_net: C1
        x: { key.column_net: C2 }
        c: { key.column_net: C3 }
        v: { key.column_net: C4 }
        b: { key.column_net: C5 }

    # ---- 最下段: Ctrl/Super/Alt(1.5u) Space(2.75u = 残り幅) ----
    lbot:
      anchor:
        shift: [0.75U, -4U]
      rows:
        r:
          row_net: R5
      columns:
        lctl:
          key:
            width: 1.5U
            tags: [k150]
            column_net: C0
        lgui:
          key:
            spread: 1.5U
            width: 1.5U
            tags: [k150]
            column_net: C1
        lalt:
          key:
            spread: 1.5U
            width: 1.5U
            tags: [k150]
            column_net: C2
        spc:
          key:
            spread: 2.125U
            width: 2.75U
            tags: [k275]
            column_net: C3

    # ================ 右手 ================
    # ---- F行: F5 F6 F7 F8 [0.5uギャップ] F9 F10 F11 F12 ----
    rfn:
      anchor:
        shift: [6.5U + splitgap, 1.5U]
      rows:
        r:
          row_net: R0
      columns:
        f5: { key.column_net: C0 }
        f6: { key.column_net: C1 }
        f7: { key.column_net: C2 }
        f8: { key.column_net: C3 }
        f9:
          key:
            spread: 1.5U
            column_net: C4
        f10: { key.column_net: C5 }
        f11: { key.column_net: C6 }
        f12: { key.column_net: C7 }

    # ---- 数字行: 6 7 8 9 0 - = Backspace(2u) Del ----
    # Del は COL6-7 の空きがないため未使用の ROW6 を使う
    rnum:
      anchor:
        shift: [6.5U + splitgap, 0]
      rows:
        r:
          row_net: R1
      columns:
        n6: { key.column_net: C0 }
        n7: { key.column_net: C1 }
        n8: { key.column_net: C2 }
        n9: { key.column_net: C3 }
        n0: { key.column_net: C4 }
        minus: { key.column_net: C5 }
        equal: { key.column_net: C6 }
        bksp:
          key:
            spread: 1.5U
            width: 2U
            tags: [k200]
            column_net: C7
        del:
          key:
            spread: 1.75U
            column_net: C6
          rows.r.row_net: R6

    # ---- Tab行: Y U I O P [ ] \(1.5u) PgUp ----
    # PgUp も同様に ROW6 を使う
    rtab:
      anchor:
        shift: [7U + splitgap, -1U]
      rows:
        r:
          row_net: R2
      columns:
        y: { key.column_net: C0 }
        u: { key.column_net: C1 }
        i: { key.column_net: C2 }
        o: { key.column_net: C3 }
        p: { key.column_net: C4 }
        lbrc: { key.column_net: C5 }
        rbrc: { key.column_net: C6 }
        bsls:
          key:
            spread: 1.25U
            width: 1.5U
            tags: [k150]
            column_net: C7
        pgup:
          key:
            spread: 1.5U
            column_net: C7
          rows.r.row_net: R6

    # ---- ホーム行: H J K L ; ' Enter(2.25u) PgDn ----
    rhome:
      anchor:
        shift: [7.25U + splitgap, -2U]
      rows:
        r:
          row_net: R3
      columns:
        h: { key.column_net: C0 }
        j: { key.column_net: C1 }
        k: { key.column_net: C2 }
        l: { key.column_net: C3 }
        scln: { key.column_net: C4 }
        quot: { key.column_net: C5 }
        ent:
          key:
            spread: 1.625U
            width: 2.25U
            tags: [k225]
            column_net: C6
        pgdn:
          key:
            spread: 1.875U
            column_net: C7

    # ---- シフト行: N M , . / RShift(1.75u) [0.25uギャップ] ↑ ----
    rshift:
      anchor:
        shift: [7.75U + splitgap, -3U]
      rows:
        r:
          row_net: R4
      columns:
        n: { key.column_net: C0 }
        m: { key.column_net: C1 }
        comm: { key.column_net: C2 }
        dot: { key.column_net: C3 }
        slsh: { key.column_net: C4 }
        rsft:
          key:
            spread: 1.375U
            width: 1.75U
            tags: [k175]
            column_net: C5
        up:
          key:
            spread: 1.625U
            column_net: C6

    # ---- 最下段: Space(2.25u) Alt/Super(1.5u) [0.75uギャップ] ← ↓ →(1u, 右端) ----
    rbot:
      anchor:
        shift: [8.375U + splitgap, -4U]
      rows:
        r:
          row_net: R5
      columns:
        spc:
          key:
            width: 2.25U
            tags: [k225]
            column_net: C0
        ralt:
          key:
            spread: 1.875U
            width: 1.5U
            tags: [k150]
            column_net: C1
        rgui:
          key:
            spread: 1.5U
            width: 1.5U
            tags: [k150]
            column_net: C2
        left:
          key:
            spread: 2U
            column_net: C3
        down:
          key:
            spread: 1U
            column_net: C4
        right:
          key:
            spread: 1U
            column_net: C7

outlines:
  # 各キーの占有領域 (1uピッチいっぱい)。幅タグごとに矩形を置き、結合して外形の元にする
  _footprint:
    - what: rectangle
      where: k100
      size: [1U, 1U]
    - what: rectangle
      where: k125
      size: [1.25U, 1U]
    - what: rectangle
      where: k150
      size: [1.5U, 1U]
    - what: rectangle
      where: k175
      size: [1.75U, 1U]
    - what: rectangle
      where: k200
      size: [2U, 1U]
    - what: rectangle
      where: k225
      size: [2.25U, 1U]
    - what: rectangle
      where: k275
      size: [2.75U, 1U]
    # F行のキー間ギャップ (Esc|F1, F8|F9) と数字行との隙間を埋めて外形を一体化するブリッジ
    - what: rectangle
      where:
        shift: [3U, 1.125U]
      size: [6U, 1.75U]
    - what: rectangle
      where:
        shift: [10.25U + splitgap, 1.125U]
      size: [8.5U, 1.75U]
    # シフト行の RShift|↑ 間の 0.25u ギャップを埋めるブリッジ
    - what: rectangle
      where:
        shift: [14.125U + splitgap, -3U]
      size: [0.25U, 1U]
    # 右最下段の RSuper|← 間の 0.75u ギャップを埋めるブリッジ
    - what: rectangle
      where:
        shift: [12.875U + splitgap, -4U]
      size: [0.75U, 1U]
    # 最右列 (Del/PgUp/PgDn) と本体の間の 0.25u ギャップを埋めるブリッジ
    - what: rectangle
      where:
        shift: [15.125U + splitgap, -1U]
      size: [0.25U, 3U]

  # キーキャップのプレビュー用 (左右まとめて確認する)
  keycaps:
    - what: rectangle
      where: k100
      size: [1U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k125
      size: [1.25U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k150
      size: [1.5U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k175
      size: [1.75U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k200
      size: [2U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k225
      size: [2.25U - 1, 1U - 1]
      corner: 1
    - what: rectangle
      where: k275
      size: [2.75U - 1, 1U - 1]
      corner: 1

  # キー占有領域を 2mm 外側に膨らませた全体形状 (左右2つの島になる)
  _field:
    - what: outline
      name: _footprint
      expand: 2
      joints: 1

  # 左手ボード外形 (全体形状から左手側だけを切り出す)
  # 切り出し境界は x = 7.25U + 3mm (左手ブロック右端 + マージン2mm と右手ブロック左端の間)
  board_left:
    - what: outline
      name: _field
    - what: rectangle
      where:
        shift: [3.625U - 1.5, -1.25U]
      size: [7.25U + 9, 6.5U + 12]
      operation: intersect

  # 右手ボード外形
  board_right:
    - what: outline
      name: _field
    - what: rectangle
      where:
        shift: [11.75U + splitgap / 2 + 4.5, -1.25U]
      size: [9U + splitgap + 3, 6.5U + 12]
      operation: intersect

  # スイッチプレート (外形から 14x14mm の MX 用穴を抜く)
  plate_left:
    - what: outline
      name: board_left
    - what: rectangle
      where: '/^l/'
      size: 14
      operation: subtract

  plate_right:
    - what: outline
      name: board_right
    - what: rectangle
      where: '/^r/'
      size: 14
      operation: subtract

pcbs:
  # ergogen は designator ごとのカウンタを footprint 定義の記述順 (PCB ごとにリセット) で進める。
  # 番号を飛ばす必要がある箇所は、カスタムフットプリント (ergogen/footprints/) の refname で明示指定する。
  # ビルドは `ergogen ergogen -o output` (バンドルフォルダ経由でカスタムフットプリントを注入)。
  ansi60_left:
    outlines:
      main:
        outline: board_left
    # 回路図 keyboard.kicad_sch は COL0-7 x ROW0-6 (8x7) のフルマトリクスで、
    # SW/D 番号 = COL*7 + ROW + 1 (列ごとに上から下、ROW6 は未使用)。
    # キーのないスロット (各列の ROW6、COL4 の ROW5、COL5 の ROW0、COL6-7 全体) は欠番になる。
    footprints:
      # ---- COL0: Esc ` Tab Caps LShift LCtrl (SW1-SW6 / D1-D6) ----
      sw1: { what: mx, where: '/^lfn_esc_r$/', params: { refname: SW1, from: "{{column_net}}", to: "{{colrow}}" } }
      d1: { what: diode, where: '/^lfn_esc_r$/', adjust: { shift: [0, -5] }, params: { refname: D1, from: "{{colrow}}", to: "{{row_net}}" } }
      sw2: { what: mx, where: '/^lnum_grv_r$/', params: { refname: SW2, from: "{{column_net}}", to: "{{colrow}}" } }
      d2: { what: diode, where: '/^lnum_grv_r$/', adjust: { shift: [0, -5] }, params: { refname: D2, from: "{{colrow}}", to: "{{row_net}}" } }
      sw3: { what: mx, where: '/^ltab_tab_r$/', params: { refname: SW3, from: "{{column_net}}", to: "{{colrow}}" } }
      d3: { what: diode, where: '/^ltab_tab_r$/', adjust: { shift: [0, -5] }, params: { refname: D3, from: "{{colrow}}", to: "{{row_net}}" } }
      sw4: { what: mx, where: '/^lhome_caps_r$/', params: { refname: SW4, from: "{{column_net}}", to: "{{colrow}}" } }
      d4: { what: diode, where: '/^lhome_caps_r$/', adjust: { shift: [0, -5] }, params: { refname: D4, from: "{{colrow}}", to: "{{row_net}}" } }
      sw5: { what: mx, where: '/^lshift_lsft_r$/', params: { refname: SW5, from: "{{column_net}}", to: "{{colrow}}" } }
      d5: { what: diode, where: '/^lshift_lsft_r$/', adjust: { shift: [0, -5] }, params: { refname: D5, from: "{{colrow}}", to: "{{row_net}}" } }
      sw6: { what: mx, where: '/^lbot_lctl_r$/', params: { refname: SW6, from: "{{column_net}}", to: "{{colrow}}" } }
      d6: { what: diode, where: '/^lbot_lctl_r$/', adjust: { shift: [0, -5] }, params: { refname: D6, from: "{{colrow}}", to: "{{row_net}}" } }
      # ---- COL1: F1 1 Q A Z LSuper (SW8-SW13 / D8-D13) ----
      sw8: { what: mx, where: '/^lfn_f1_r$/', params: { refname: SW8, from: "{{column_net}}", to: "{{colrow}}" } }
      d8: { what: diode, where: '/^lfn_f1_r$/', adjust: { shift: [0, -5] }, params: { refname: D8, from: "{{colrow}}", to: "{{row_net}}" } }
      sw9: { what: mx, where: '/^lnum_n1_r$/', params: { refname: SW9, from: "{{column_net}}", to: "{{colrow}}" } }
      d9: { what: diode, where: '/^lnum_n1_r$/', adjust: { shift: [0, -5] }, params: { refname: D9, from: "{{colrow}}", to: "{{row_net}}" } }
      sw10: { what: mx, where: '/^ltab_q_r$/', params: { refname: SW10, from: "{{column_net}}", to: "{{colrow}}" } }
      d10: { what: diode, where: '/^ltab_q_r$/', adjust: { shift: [0, -5] }, params: { refname: D10, from: "{{colrow}}", to: "{{row_net}}" } }
      sw11: { what: mx, where: '/^lhome_a_r$/', params: { refname: SW11, from: "{{column_net}}", to: "{{colrow}}" } }
      d11: { what: diode, where: '/^lhome_a_r$/', adjust: { shift: [0, -5] }, params: { refname: D11, from: "{{colrow}}", to: "{{row_net}}" } }
      sw12: { what: mx, where: '/^lshift_z_r$/', params: { refname: SW12, from: "{{column_net}}", to: "{{colrow}}" } }
      d12: { what: diode, where: '/^lshift_z_r$/', adjust: { shift: [0, -5] }, params: { refname: D12, from: "{{colrow}}", to: "{{row_net}}" } }
      sw13: { what: mx, where: '/^lbot_lgui_r$/', params: { refname: SW13, from: "{{column_net}}", to: "{{colrow}}" } }
      d13: { what: diode, where: '/^lbot_lgui_r$/', adjust: { shift: [0, -5] }, params: { refname: D13, from: "{{colrow}}", to: "{{row_net}}" } }
      # ---- COL2: F2 2 W S X LAlt (SW15-SW20 / D15-D20) ----
      sw15: { what: mx, where: '/^lfn_f2_r$/', params: { refname: SW15, from: "{{column_net}}", to: "{{colrow}}" } }
      d15: { what: diode, where: '/^lfn_f2_r$/', adjust: { shift: [0, -5] }, params: { refname: D15, from: "{{colrow}}", to: "{{row_net}}" } }
      sw16: { what: mx, where: '/^lnum_n2_r$/', params: { refname: SW16, from: "{{column_net}}", to: "{{colrow}}" } }
      d16: { what: diode, where: '/^lnum_n2_r$/', adjust: { shift: [0, -5] }, params: { refname: D16, from: "{{colrow}}", to: "{{row_net}}" } }
      sw17: { what: mx, where: '/^ltab_w_r$/', params: { refname: SW17, from: "{{column_net}}", to: "{{colrow}}" } }
      d17: { what: diode, where: '/^ltab_w_r$/', adjust: { shift: [0, -5] }, params: { refname: D17, from: "{{colrow}}", to: "{{row_net}}" } }
      sw18: { what: mx, where: '/^lhome_s_r$/', params: { refname: SW18, from: "{{column_net}}", to: "{{colrow}}" } }
      d18: { what: diode, where: '/^lhome_s_r$/', adjust: { shift: [0, -5] }, params: { refname: D18, from: "{{colrow}}", to: "{{row_net}}" } }
      sw19: { what: mx, where: '/^lshift_x_r$/', params: { refname: SW19, from: "{{column_net}}", to: "{{colrow}}" } }
      d19: { what: diode, where: '/^lshift_x_r$/', adjust: { shift: [0, -5] }, params: { refname: D19, from: "{{colrow}}", to: "{{row_net}}" } }
      sw20: { what: mx, where: '/^lbot_lalt_r$/', params: { refname: SW20, from: "{{column_net}}", to: "{{colrow}}" } }
      d20: { what: diode, where: '/^lbot_lalt_r$/', adjust: { shift: [0, -5] }, params: { refname: D20, from: "{{colrow}}", to: "{{row_net}}" } }
      # ---- COL3: F3 3 E D C Space (SW22-SW27 / D22-D27) ----
      sw22: { what: mx, where: '/^lfn_f3_r$/', params: { refname: SW22, from: "{{column_net}}", to: "{{colrow}}" } }
      d22: { what: diode, where: '/^lfn_f3_r$/', adjust: { shift: [0, -5] }, params: { refname: D22, from: "{{colrow}}", to: "{{row_net}}" } }
      sw23: { what: mx, where: '/^lnum_n3_r$/', params: { refname: SW23, from: "{{column_net}}", to: "{{colrow}}" } }
      d23: { what: diode, where: '/^lnum_n3_r$/', adjust: { shift: [0, -5] }, params: { refname: D23, from: "{{colrow}}", to: "{{row_net}}" } }
      sw24: { what: mx, where: '/^ltab_e_r$/', params: { refname: SW24, from: "{{column_net}}", to: "{{colrow}}" } }
      d24: { what: diode, where: '/^ltab_e_r$/', adjust: { shift: [0, -5] }, params: { refname: D24, from: "{{colrow}}", to: "{{row_net}}" } }
      sw25: { what: mx, where: '/^lhome_d_r$/', params: { refname: SW25, from: "{{column_net}}", to: "{{colrow}}" } }
      d25: { what: diode, where: '/^lhome_d_r$/', adjust: { shift: [0, -5] }, params: { refname: D25, from: "{{colrow}}", to: "{{row_net}}" } }
      sw26: { what: mx, where: '/^lshift_c_r$/', params: { refname: SW26, from: "{{column_net}}", to: "{{colrow}}" } }
      d26: { what: diode, where: '/^lshift_c_r$/', adjust: { shift: [0, -5] }, params: { refname: D26, from: "{{colrow}}", to: "{{row_net}}" } }
